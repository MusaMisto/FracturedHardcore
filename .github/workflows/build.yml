name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, gametests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compiles, JUnit, headless gametest server)
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain

      - name: Upload mod jar and resource pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fractured-hardcore
          path: |
            build/libs/*.jar
            build/libs/*.zip
          if-no-files-found: error

      - name: Upload test reports and gametest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/
            build/test-results/
            build/run/gameTest/logs/
          if-no-files-found: ignore
